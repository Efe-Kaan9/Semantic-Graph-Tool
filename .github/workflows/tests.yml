name: Semantic Graph Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Multi-Language Core Tests
      run: python test_multi_lang.py
        
    - name: Run Extreme Edge Cases Tests
      run: python test_edge_cases.py
      
    - name: Run Enterprise Simulation Tests
      run: python test_enterprise_simulation.py
